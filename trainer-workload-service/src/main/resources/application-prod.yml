spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASS}@${MONGO_HOST}:27017/workloaddb_prod?authSource=admin
      auto-index-creation: true


logging:
  level:
    root: ERROR
    com.epam.gym.trainerworkloadservice: WARN
    org.springframework.jms: ERROR
    org.apache.activemq: ERROR