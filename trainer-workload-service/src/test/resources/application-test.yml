spring:
  config:
    activate:
      on-profile: test

  # H2 in-memory database
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # Embedded ActiveMQ broker
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: admin
    password: admin
    packages:
      trust-all: true

  jms:
    template:
      default-destination: trainer.workload.queue
    pub-sub-domain: false

  # Embedded MongoDB
  data:
    mongodb:
      host: localhost
      port: 0
      database: testdb

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: testSecretKeyForJWTTokenGenerationWhichShouldBeLongEnough123456789
  expiration: 3600000

app:
  jms:
    queue:
      trainer-workload: trainer.workload.queue
      trainer-workload-dlq: trainer.workload.dlq

logging:
  level:
    root: WARN
    com.epam.gym: INFO