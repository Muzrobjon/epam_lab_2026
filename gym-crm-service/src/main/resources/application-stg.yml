spring:
  config:
    activate:
      on-profile: stg

  datasource:
    url: jdbc:h2:mem:stgdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Use existing JMS config from main application
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: admin
    password: admin
    packages:
      trust-all: true

eureka:
  client:
    enabled: false

workload:
  service:
    url: http://localhost:8082

logging:
  level:
    root: WARN
    com.epam.gym: INFO
    org.springframework.jms: INFO