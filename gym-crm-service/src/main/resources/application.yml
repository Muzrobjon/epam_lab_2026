spring:
  application:
    name: gym-crm-service

  # ActiveMQ
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: false
      trusted: com.epam.gym

workload:
  service:
    url: http://localhost:8082
  # JMS
  jms:
    template:
      default-destination: trainer.workload.queue
    pub-sub-domain: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Transaction-Id}] %-5level %logger{36} --- %msg%n"
  level:
    org.springframework.jms: INFO
    org.apache.activemq: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnough123456789}
  expiration: ${JWT_EXPIRATION:7200000}

security:
  brute-force:
    max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:3}
    block-duration-minutes: ${BRUTE_FORCE_BLOCK_DURATION:5}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

app:
  jms:
    queue:
      trainer-workload: trainer.workload.queue
      trainer-workload-dlq: trainer.workload.dlq